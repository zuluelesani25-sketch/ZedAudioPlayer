name: Build Zed Audio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6'

      - name: Extract Zed Audio project
        run: |
          mkdir -p project
          unzip -q ZedAudioPlayer_v1_source.zip -d project

      - name: Find project root
        run: |
          PROJECT_ROOT="$(dirname "$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1)")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" zed-audio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zed-Audio-debug
          path: zed-audio.apk
